# The lsuite launcher: install and update the lsuite apps, the lsuite AI account and lsuite Cloud.
# lsuite-core holds everything (command registry, installer, account, cloud client); the window
# (crates/lsuite-desktop, package and binary `lsuite`), lsuite-cli and lsuite-mcp are its clients.
[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/lsuite-desktop", "crates/lsuite-cli", "crates/lsuite-mcp"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/ludovic111/lsuite"
# The highest any dependency asks for: oo7 0.6 (GPUI's Linux keyring, through gpui_linux) needs 1.92.
rust-version = "1.92"

[workspace.dependencies]
lsuite-core = { path = "crates/lsuite-core" }

anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
ed25519-dalek = "2"
flate2 = "1"
futures = "0.3"
minisign-verify = "0.2"
parking_lot = "0.12"
percent-encoding = "2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "process", "io-util", "io-std", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4

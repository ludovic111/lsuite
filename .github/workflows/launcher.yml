name: Launcher

# The lsuite launcher (launcher/): tests on Linux and macOS, then real installs of the apps from
# their signed releases with lsuite-cli on each system (the macOS .app.tar.gz and zip paths, the
# Linux AppImage and tar.gz), into a scratch folder. Releases are built by the suite release
# workflow (see launcher/README.md, Releasing).
on:
  push:
    branches: [main]
    paths: ['launcher/**', '.github/workflows/launcher.yml']
  pull_request:
    paths: ['launcher/**', '.github/workflows/launcher.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Linux on every push and pull request. macOS only when started by hand
        # (gh workflow run launcher.yml --ref <branch>), on the owner's Mac mini, a self-hosted
        # runner (vars.MAC_RUNNER=macos-latest sends it back to GitHub): a pull request, from a
        # fork or not, never reaches it. Windows is coming soon: its steps are kept below; add
        # {"name":"Windows","os":"windows-latest"} to the list to run them.
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('[{{"name":"Linux","os":"ubuntu-22.04"}},{{"name":"macOS","os":"{0}"}}]', vars.MAC_RUNNER || 'ludovics-mac-mini') || '[{"name":"Linux","os":"ubuntu-22.04"}]') }}
    defaults:
      run:
        shell: bash
        working-directory: launcher
    env:
      LSUITE_HOME: ${{ github.workspace }}/scratch/home
      LSUITE_APPS_DIR: ${{ github.workspace }}/scratch/apps
      LSUITE_NO_UPDATE: '1'
      # The apps come through lsuite.xyz's builds route (DISTRIBUTION.md), no account needed: the
      # real installs run against this repository's own site, started below, reading the private
      # builds with this secret. Without it they're skipped.
      HAS_BUILDS: ${{ secrets.LSUITE_BUILDS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The Mac mini runs as the owner's account: keep its warm target/ between runs.
          clean: ${{ runner.environment == 'github-hosted' }}
          persist-credentials: false
      - name: Scratch folders
        working-directory: .
        run: rm -rf scratch && mkdir -p scratch
      - name: Linux build dependencies
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang libasound2-dev libdbus-1-dev libfontconfig-dev libfreetype-dev \
            libssl-dev libvulkan-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libzstd-dev libglib2.0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: launcher -> target
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Build the CLI
        run: cargo build --locked -p lsuite-cli
      - name: Launcher bundle (macOS, ad-hoc signed)
        if: runner.os == 'macOS'
        run: |
          bash scripts/bundle-macos.sh "$(rustc -vV | sed -n 's/^host: //p')"
          ls -l target/dist
          app=$(ls -d target/dist/*-apple-darwin/lsuite.app)
          "$app/Contents/MacOS/lsuite" --version
          "$app/Contents/MacOS/lsuite-cli" app.version

      - name: Local site
        if: env.HAS_BUILDS == 'true'
        working-directory: .
        env:
          LSUITE_BUILDS_TOKEN: ${{ secrets.LSUITE_BUILDS_TOKEN }}
        run: |
          PORT=4499 LSUITE_DATA_DIR="$RUNNER_TEMP/site" nohup node server.js > "$RUNNER_TEMP/site.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/site.pid"
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4499/health > /dev/null && break; sleep 1; done
          echo "LSUITE_SERVER=http://127.0.0.1:4499" >> "$GITHUB_ENV"
          # The builds route is public since the site went free; a site that still asks for an
          # account can't serve the launcher.
          status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4499/api/apps/folio/latest)
          if [ "$status" = 401 ]; then
            echo "::notice::Real installs skipped: this checkout's site still asks for an account on /api/apps (the free site isn't merged yet)."
            echo "SITE_FREE=false" >> "$GITHUB_ENV"
          else
            echo "SITE_FREE=true" >> "$GITHUB_ENV"
          fi

      - name: Real installs skipped
        if: env.HAS_BUILDS != 'true'
        run: |
          echo "::notice::Real installs skipped: add the LSUITE_BUILDS_TOKEN secret (read access to ludovic111/lsuite-builds) to run them."

      - name: Real installs (macOS)
        if: runner.os == 'macOS' && env.HAS_BUILDS == 'true' && env.SITE_FREE == 'true'
        run: |
          cli=target/debug/lsuite-cli
          # An app whose latest release has no macOS build yet is skipped, not failed.
          installed=()
          for app in folio ryolune; do    # .app.tar.gz with minisign; zip through ditto with signed SHA256SUMS
            if out=$($cli apps.install app=$app 2>&1); then
              installed+=("$app")
            elif grep -q "no macOS build\|don't list" <<< "$out"; then
              echo "::notice::$app has no macOS build in its latest release yet: $out"
            else
              echo "$out"; exit 1
            fi
          done
          for app in ${installed[@]+"${installed[@]}"}; do
            test -x "$LSUITE_APPS_DIR/$app.app/Contents/MacOS/$app"
            if [ "$app" = folio ]; then
              codesign --verify --deep --strict "$LSUITE_APPS_DIR/folio.app"
              "$LSUITE_APPS_DIR/folio.app/Contents/MacOS/folio" --version
            fi
            $cli apps.uninstall app=$app
            test ! -e "$LSUITE_APPS_DIR/$app.app"
          done

      - name: Real installs (Windows)
        if: runner.os == 'Windows' && env.HAS_BUILDS == 'true' && env.SITE_FREE == 'true'
        run: |
          cli=target/debug/lsuite-cli.exe
          $cli apps.install app=ryolune    # portable zip, signed SHA256SUMS
          test -f "$LSUITE_APPS_DIR/ryolune/ryolune.exe"
          $cli apps.install app=folio      # the NSIS installer, run silently (per user)
          test -f "$LOCALAPPDATA/folio/folio.exe"
          $cli apps.list > list.json
          grep -q '"installed": 2' list.json
          $cli apps.uninstall app=folio    # runs its uninstaller
          sleep 5
          test ! -f "$LOCALAPPDATA/folio/folio.exe"
          $cli apps.uninstall app=ryolune
          test ! -e "$LSUITE_APPS_DIR/ryolune"

      - name: Real installs (Linux)
        if: runner.os == 'Linux' && env.HAS_BUILDS == 'true' && env.SITE_FREE == 'true'
        run: |
          cli=target/debug/lsuite-cli
          $cli apps.install app=ryolune    # tar.gz, signed SHA256SUMS
          $cli apps.install app=nori       # AppImage, minisign
          test -x "$LSUITE_APPS_DIR/ryolune/ryolune"
          test -x "$LSUITE_APPS_DIR/nori/nori.AppImage"
          $cli apps.uninstall app=ryolune
          test ! -e "$LSUITE_APPS_DIR/ryolune"

      - name: Clean up
        if: always()
        working-directory: .
        run: |
          if [ -f "$RUNNER_TEMP/site.pid" ]; then kill "$(cat "$RUNNER_TEMP/site.pid")" 2> /dev/null || true; rm -f "$RUNNER_TEMP/site.pid"; fi
          rm -rf scratch "$RUNNER_TEMP/site"

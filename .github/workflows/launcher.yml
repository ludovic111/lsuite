name: Launcher

# The lsuite launcher (launcher/): tests on macOS, Windows and Linux, then real installs of the
# apps from their signed releases with lsuite-cli on each system (the macOS .app.tar.gz and zip
# paths, the Windows installer and portable zip, the Linux AppImage and tar.gz), into a scratch
# folder. Releases are built by the suite release workflow (see launcher/README.md, Releasing).
on:
  push:
    branches: [main]
    paths: ['launcher/**', '.github/workflows/launcher.yml']
  pull_request:
    paths: ['launcher/**', '.github/workflows/launcher.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Linux only. macOS and Windows only when started by hand: gh workflow run launcher.yml --ref <branch>.
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[{"name":"Linux","os":"ubuntu-22.04"},{"name":"macOS","os":"macos-14"},{"name":"Windows","os":"windows-latest"}]' || '[{"name":"Linux","os":"ubuntu-22.04"}]') }}
    defaults:
      run:
        shell: bash
        working-directory: launcher
    env:
      LSUITE_HOME: ${{ github.workspace }}/scratch/home
      LSUITE_APPS_DIR: ${{ github.workspace }}/scratch/apps
      LSUITE_NO_UPDATE: '1'
      # The apps come through lsuite.xyz's builds route (DISTRIBUTION.md): the real installs run
      # against this repository's own site, started below, reading the private builds with this
      # secret. Without it they're skipped.
      HAS_BUILDS: ${{ secrets.LSUITE_BUILDS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang libasound2-dev libdbus-1-dev libfontconfig-dev libfreetype-dev \
            libssl-dev libvulkan-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libzstd-dev libglib2.0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher -> target
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Build the CLI
        run: cargo build --locked -p lsuite-cli

      - name: Local site and a signed-in test account
        if: env.HAS_BUILDS == 'true'
        working-directory: .
        env:
          LSUITE_BUILDS_TOKEN: ${{ secrets.LSUITE_BUILDS_TOKEN }}
        run: |
          (PORT=4499 LSUITE_DATA_DIR="$RUNNER_TEMP/site" node server.js > "$RUNNER_TEMP/site.log" 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4499/health > /dev/null && break; sleep 1; done
          jar="$RUNNER_TEMP/jar"
          curl -sf -c "$jar" -b "$jar" -H 'content-type: application/json' -d '{"email":"ci@example.com","name":"CI"}' http://127.0.0.1:4499/api/account/session > /dev/null
          key=$(curl -sf -c "$jar" -b "$jar" -H 'content-type: application/json' -d '{}' http://127.0.0.1:4499/api/account/key | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).key))')
          echo "LSUITE_ACCOUNT_SERVER=http://127.0.0.1:4499" >> "$GITHUB_ENV"
          echo "::add-mask::$key"
          echo "CI_KEY=$key" >> "$GITHUB_ENV"

      - name: Sign in
        if: env.HAS_BUILDS == 'true'
        run: |
          cli=target/debug/lsuite-cli; [ -x "$cli" ] || cli=target/debug/lsuite-cli.exe
          $cli account.signIn key=$CI_KEY > /dev/null

      - name: Real installs skipped
        if: env.HAS_BUILDS != 'true'
        run: |
          echo "::notice::Real installs skipped: add the LSUITE_BUILDS_TOKEN secret (read access to ludovic111/lsuite-builds) to run them."

      - name: Real installs (macOS)
        if: runner.os == 'macOS' && env.HAS_BUILDS == 'true'
        run: |
          cli=target/debug/lsuite-cli
          $cli apps.install app=folio      # .app.tar.gz, minisign
          $cli apps.install app=ryolune    # zip through ditto, signed SHA256SUMS
          test -x "$LSUITE_APPS_DIR/folio.app/Contents/MacOS/folio"
          test -x "$LSUITE_APPS_DIR/ryolune.app/Contents/MacOS/ryolune"
          codesign --verify --deep --strict "$LSUITE_APPS_DIR/folio.app"
          "$LSUITE_APPS_DIR/folio.app/Contents/MacOS/folio" --version
          $cli apps.list | grep -q '"installed": 2'
          $cli apps.uninstall app=ryolune
          test ! -e "$LSUITE_APPS_DIR/ryolune.app"

      - name: Real installs (Windows)
        if: runner.os == 'Windows' && env.HAS_BUILDS == 'true'
        run: |
          cli=target/debug/lsuite-cli.exe
          $cli apps.install app=ryolune    # portable zip, signed SHA256SUMS
          test -f "$LSUITE_APPS_DIR/ryolune/ryolune.exe"
          $cli apps.install app=folio      # the NSIS installer, run silently (per user)
          test -f "$LOCALAPPDATA/folio/folio.exe"
          $cli apps.list > list.json
          grep -q '"installed": 2' list.json
          $cli apps.uninstall app=folio    # runs its uninstaller
          sleep 5
          test ! -f "$LOCALAPPDATA/folio/folio.exe"
          $cli apps.uninstall app=ryolune
          test ! -e "$LSUITE_APPS_DIR/ryolune"

      - name: Real installs (Linux)
        if: runner.os == 'Linux' && env.HAS_BUILDS == 'true'
        run: |
          cli=target/debug/lsuite-cli
          $cli apps.install app=zenith     # tar.gz, signed SHA256SUMS
          $cli apps.install app=nori       # AppImage, minisign
          "$LSUITE_APPS_DIR/zenith/zenith" --version
          test -x "$LSUITE_APPS_DIR/nori/nori.AppImage"
          $cli apps.uninstall app=zenith
          test ! -e "$LSUITE_APPS_DIR/zenith"
